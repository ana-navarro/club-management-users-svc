name: CI

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

  trigger-ai-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger the AI Pipeline
        env:
          GH_TOKEN: ${{ secrets.AI_PIPELINE_TOKEN }}
          AI_REPO: ${{ github.repository_owner }}/club-management-ai
          BRANCH: ${{ github.ref_name }}
        run: |
          ref=main
          if gh api "repos/$AI_REPO/branches/$BRANCH" > /dev/null 2>&1; then
            ref=$BRANCH
          fi
          gh workflow run ci.yml -R "$AI_REPO" --ref "$ref" -f project_branch="$BRANCH"
